name: Update GitHub Achievements

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=akherox&theme=algolia&no-frame=true&margin-w=8&row=1'
          path: achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit achievements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements.svg
          git diff --cached --quiet || (
            git commit -m "Update GitHub achievements"
            git push
          )
